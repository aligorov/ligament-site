# Ligament Site — Enterprise Nginx / Caddy Security Headers
# Zero external requests, zero third-party trackers, zero CDN dependencies

# 1. Content Security Policy (Strict On-Premise)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'none'; frame-ancestors 'none'; form-action 'self' https:; base-uri 'none'; object-src 'none'; upgrade-insecure-requests" always;

# 2. Strict Transport Security (HSTS 1 year + subdomains + preload)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# 3. Anti-MIME sniffing
add_header X-Content-Type-Options "nosniff" always;

# 4. Anti-Clickjacking / Frame Protection
add_header X-Frame-Options "DENY" always;

# 5. Referrer Policy (Strict privacy)
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 6. Permissions Policy (Disables unused sensitive hardware APIs)
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), autoplay=(), interest-topic-ads=()" always;

# 7. Cross-Origin Isolation
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# 8. Server identity hiding
server_tokens off;
