version: '3.8'

services:
  ligament-site:
    build:
      context: .
      dockerfile: Dockerfile
    image: ligament-site:latest
    container_name: ligament-site
    restart: unless-stopped
    ports:
      # Привязка СТРОГО к 127.0.0.1 (локальный хост).
      # Наружу в интернет порт НЕ светится, доступен только для локального Nginx/Caddy!
      - "127.0.0.1:8088:80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
