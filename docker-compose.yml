services:
  ligament-site:
    build:
      context: .
      dockerfile: Dockerfile
    image: aligorov/ligament-site:latest
    container_name: ligament-site
    restart: unless-stopped
    networks:
      - crypto_bot_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  crypto_bot_net:
    external: true
    name: crypto-bot_bot-network
