version: '3.8'

services:
  ligament-site:
    build:
      context: .
      dockerfile: Dockerfile
    image: ligament-site:latest
    container_name: ligament-site
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
