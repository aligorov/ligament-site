server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    # Include strict enterprise security headers
    include /etc/nginx/security-headers.conf;

    # Branded 404 keeps the real 404 status (no soft-404)
    error_page 404 /404.html;

    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ =404;
    }

    # Static Assets Caching (30 days)
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|pdf|webm|mp4|woff2|woff)$ {
        add_header Cache-Control "public, max-age=2592000, immutable, no-transform";
        include /etc/nginx/security-headers.conf;
    }
}
