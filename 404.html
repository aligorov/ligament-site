<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'; upgrade-insecure-requests">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#07090e">
  <title>404 — страница не найдена | Ligament 2FA</title>
  <style>
    :root { color-scheme: dark light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-color: #07090e;
      color: #e2e8f0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .code {
      font-size: clamp(72px, 18vw, 160px);
      line-height: 1;
      margin: 0;
      font-weight: 800;
      letter-spacing: 0.05em;
      background: linear-gradient(90deg, #38bdf8, #06b6d4);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    h1 { font-size: clamp(20px, 4vw, 30px); margin: 12px 0 8px; }
    p { color: #94a3b8; margin: 0 0 28px; max-width: 46ch; line-height: 1.6; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
    }
    .primary { background: #06b6d4; color: #04121c; }
    .primary:hover { background: #38bdf8; }
    .ghost { border: 1px solid rgba(148, 163, 184, 0.4); color: #cbd5e1; }
    .ghost:hover { border-color: #38bdf8; color: #38bdf8; }
    .hint { margin-top: 26px; font-size: 13px; color: #64748b; }
    .bg-neural-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }
    main { position: relative; z-index: 1; }
  </style>
</head>
<body>
  <canvas id="bg-neural-canvas" class="bg-neural-canvas" aria-hidden="true"></canvas>
  <main>
    <p class="code">404</p>
    <h1>Страница не найдена</h1>
    <p>Такого адреса нет на сайте. Возможно, он переехал после очередного обновления релиза.</p>
    <div class="actions">
      <a class="primary" href="/">На главную (RU)</a>
      <a class="ghost" href="/en/">Home (EN)</a>
    </div>
    <p class="hint">Page not found — use one of the links above.</p>
  </main>
  <script src="site.js?v=neural-mesh-1"></script>
</body>
</html>
